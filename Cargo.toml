[workspace]
# the mechanical model of the design tool and the numeric engine of the solver of its sketches; the solid operations, the export to STEP and the assemblies join it once their contracts are accepted
members = ["crates/eh3d-phoenix-cad", "crates/eh3d-phoenix-cad-solver"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-CAD"

# Argon2id is meant to cost time and memory: unoptimised it would cost the tests many times more
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
