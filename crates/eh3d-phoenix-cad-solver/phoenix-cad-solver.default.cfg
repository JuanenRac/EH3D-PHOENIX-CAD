# EH3D-PHOENIX-CAD, the solver engine: the settings, with their default values.
#
# This is the one file where the tuned values of the engine live; the code holds none of them. A user
# file has the same form and only needs the keys it changes (Settings::from_cfg_text). The program
# that uses the engine (the sketch of EH3D-PHOENIX-CAD) keeps the same values in the section [sketch]
# of phoenix-cad-sketch.default.cfg; a test checks that the two files agree. Text after " #" is a comment.
#
# The engine knows no unit: the unknowns and the residuals are in the unit of the caller (the sketch
# uses millimetres).

[solver]
tolerance = 0.00000001      # the solution is accepted when no residual is larger than this
max_iterations = 100        # steps of the solver before it gives up
max_step = 50               # the largest move of any unknown in one step
fd_step = 0.0001            # the step of the central differences that give the Jacobian
rank_tolerance = 0.000001   # a row of the Jacobian that adds less than this (relative) is redundant
damping_start = 0.001       # the first damping of the least squares
damping_factor = 10         # the damping grows or shrinks by this factor after a refused or accepted step
damping_max = 1000000000000 # beyond this damping the solver stops: no step gets nearer
stall_tolerance = 0.0000001 # the gradient below which the solver is at a minimum that is not a solution
max_unknowns = 4000         # the most unknowns of a problem (a bigger one is refused)
max_rows = 8000             # the most residual rows of a problem
