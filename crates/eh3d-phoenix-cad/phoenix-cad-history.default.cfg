# EH3D-PHOENIX-CAD, the history of features: the settings, with their default values.
#
# This is the one file where the tuned values of the history live; the code holds none of them. A user
# file has the same form and only needs the keys it changes (--config FILE). It can be the same file as
# the settings of the library (phoenix-cad.default.cfg), of the window and of the sketch: each part
# reads its own sections. Text after " #" is a comment.

[history]
max_nodes = 2000            # the most nodes (parameters and features) of a history
max_file_bytes = 1048576    # the largest history file that is read
max_array = 1000            # the most copies of an array
max_extra_lines = 8         # the most lines of a newer program that a node keeps as they are
max_extra_bytes = 512       # the most bytes of one of those lines
max_cells = 2000000         # the most cells of the grid of one operation between solids
max_prisms = 100000         # the most prisms of a solid
