[package]
name = "eh3d-phoenix-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The mechanical model of the design: lengths in integer nanometres with their own range, a parametric enclosure, structured change operations that report conflicts and leave the model unchanged, an OpenSCAD-style script, a fit check against the envelope of a board and 2D sketches with constraints whose outlines can be raised from a face or cut into it"

[dependencies]
# the numeric engine of the solver of the sketches (the contract is in that crate: unknowns, residual rows, degrees of freedom, redundant and conflicting constraints)
eh3d-phoenix-cad-solver = { version = ">=0.1.2", path = "../eh3d-phoenix-cad-solver" }
# the object identity (UUID v7) is the one of the shared repository, next to this one; the CI checks out the tag named in SIBLING_REFS
eh3d-container = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/container" }
# the link to EH3D-SERVER (projects kept on it, reports sent to it) is the client every program of the suite uses; no dependency of its own
eh3d-serverclient = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/serverclient" }

# the words of the frame of the window and the panel of the settings of the server that every program of the suite shows (the model has no window in it; the drawing is the feature `gui`)
[dependencies.eh3d-view]
version = ">=0.0.1"
path = "../../../EH3D-COMMON/crates/view"

# the frame of the window: panels that dock, float and fold, workspaces, the menu bar and the shortcuts; the model has no window, the drawing is the feature `gui`
[dependencies.eh3d-dock]
version = ">=0.0.1"
path = "../../../EH3D-COMMON/crates/dock"
default-features = false

[[bin]]
name = "eh3d-phoenix-cad"
path = "src/main.rs"

[features]
default = []
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png", "eh3d-view/gui", "eh3d-dock/gui"]

# the window
[dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow", "default_fonts"]
optional = true

[dependencies.png]
version = "0.17"
optional = true

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow", "default_fonts", "x11", "wayland"]
optional = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
