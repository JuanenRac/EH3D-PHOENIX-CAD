[package]
name = "eh3d-phoenix-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The mechanical model of the design: lengths in integer nanometres with their own range, a parametric enclosure, structured change operations that report conflicts and leave the model unchanged, an OpenSCAD-style script and a fit check against the envelope of a board"

[dependencies]
# the object identity (UUID v7) is the one of the shared repository, next to this one; the CI checks out the tag named in SIBLING_REFS
eh3d-container = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/container" }

[[bin]]
name = "eh3d-phoenix-cad"
path = "src/main.rs"

[features]
default = []
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png"]

# the window
[dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow", "default_fonts"]
optional = true

[dependencies.png]
version = "0.17"
optional = true

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["glow", "default_fonts", "x11", "wayland"]
optional = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
