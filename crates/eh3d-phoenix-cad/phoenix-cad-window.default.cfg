# EH3D-PHOENIX-CAD, the window: the settings, with their default values.
#
# This is the one file where the tuned values of the window live; the code holds none of them. A
# user file has the same form and only needs the keys it changes (--config FILE). It can be the
# same file as the settings of the library (phoenix-cad.default.cfg): each part reads its own
# sections. Lengths are written with their unit (mm, um, in, mil, ...); text after " #" is a comment.

[window]
width = 1180                # pixels of the window when it opens
height = 760
min_width = 760
min_height = 480

[view]
yaw = 35                    # degrees: the turn of the 3D view about the vertical axis
pitch = 28                  # degrees above the horizon (90 looks straight down)
zoom_min = 0.2              # a view never zooms out beyond this ...
zoom_max = 12               # ... or in beyond this, times the size that fits its pane
rotate_speed = 0.4          # degrees of turn for each pixel dragged
wheel_speed = 0.0015        # zoom for each unit of the mouse wheel (the exponent of the factor)
circle_segments = 32        # segments of the circle that draws a hole or a post
margin = 24                 # pixels left empty around the drawing when it is fitted to its pane

[new_box]
# the box a new project starts with
inner_length = 100 mm
inner_width = 60 mm
inner_height = 30 mm
wall = 2 mm
floor = 2 mm
lid = 3 mm
edge_margin = 3 mm
min_web = 2 mm

[fit]
# the envelope that is checked when the project has no board of its own
length = 90 mm
width = 50 mm
height = 20 mm

[edges]
size = 1 mm                 # the size given to an edge that is changed from sharp to rounded or chamfered

[new_step]
# what a hole, a post, an edge treatment, an extrusion, a pocket, a pattern, a set of cooling fins, a part of the catalog or a mate added from the window starts with
tries = 12                  # positions tried (moving by the pitch each time) before the step is refused
pitch = 12 mm               # the distance between two tries
hole_face = front           # front, back, left, right, top or bottom
hole_u = 14 mm              # the position of the centre to the right, from the lower left corner of the face
hole_v = 15 mm              # the position of the centre upwards
hole_diameter = 6 mm
post_x = 10 mm              # from the inner face of the left wall
post_y = 10 mm              # from the inner face of the front wall
post_outer = 8 mm
post_height = 6 mm
post_kind = insert          # insert or self-tapping
post_bore_diameter = 4.2 mm
post_bore_depth = 5 mm
extrude_height = 5 mm       # the height of a new extrusion of a sketch
pocket_depth = 0 mm         # the depth of a new pocket of a sketch; 0 cuts through the face
pattern_count = 4           # the positions of a new pattern of holes or posts (2 to 1000, the seed among them)
pattern_step = 10 mm        # the step between two positions of a new line of holes or posts
pattern_radius = 5 mm       # a pattern changed to a circle gets its centre this far from the seed along both axes
pattern_angle = 90          # degrees between two positions of a circle
fin_face = top              # the face of a new set of cooling fins: front, back, left, right, top or bottom
fin_along = u               # the direction the fins run: u or v
fin_count = 5               # the fins of a new set (1 to 1000; the settings of the library say how many are allowed)
fin_thickness = 2 mm        # the thickness of a fin
fin_height = 15 mm          # how far a fin rises from the face
fin_pitch = 8 mm            # from the middle of one fin to the middle of the next
fin_first = 12 mm           # the middle of the first fin, across the direction they run (moves along by the pitch of the tries)
fin_start = 10 mm           # where the fins start, along the direction they run
fin_length = 80 mm          # the length of a fin
part_x = 0 mm               # a part of the catalog starts with the smallest corner of its bounding box here (moves along x by the pitch of the tries) ...
part_y = 0 mm               # ... and here ...
part_z = 0 mm               # ... and here
part_axis = +z              # the direction the length of a new part runs along: +x, -x, +y, -y, +z or -z
part_roll = 0               # the roll of a new part about its length, in degrees: 0, 90, 180 or 270
mate_kind = stack           # the kind of a mate added from the window: gap, align or stack
mate_direction = +z         # a gap: the side of the fixed part the placed part goes on: +x, -x, +y, -y, +z or -z
mate_distance = 0 mm        # a gap: the air between the two faces
mate_axis = z               # an alignment: the axis across the plane: x, y or z
mate_edge = min             # an alignment: the faces put on one plane: min (lower), max (upper) or center (middle)

[drag]
# dragging a hole or a post with the mouse in the views
snap = 1                    # 1: a dragged centre snaps to the grid when the window opens, 0: it does not
grid = 0.5 mm               # the grid a dragged centre snaps to; 0 mm is no grid
hit_radius = 12             # pixels from the drawn centre of a hole or a post within which a press picks it

[measure]
# the measurement tools of the views
unit = display              # the unit of a length: display (the one shown everywhere else), nm, um, mm, cm, m, in or mil
decimals = 3                # decimals of a length
angle_decimals = 2          # decimals of an angle, in degrees
pick_radius = 10            # pixels from a drawn point or edge within which a click picks it
keep = 16                   # readings kept in the panel; the oldest is dropped
marker = 1.5 mm             # the size of the cross drawn on a point that is picked or measured

[export]
# the files written from the window (script, STEP file and the text of the fit report)
format = script             # the format the export dialog starts with: script, step, report or bill
overwrite = 0               # 1: the box to write over an existing file is ticked when the window opens, 0: it is not
max_kib = 65536             # the largest text written, in KiB; a larger one is refused
