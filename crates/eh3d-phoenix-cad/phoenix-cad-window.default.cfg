# EH3D-PHOENIX-CAD, the window: the settings, with their default values.
#
# This is the one file where the tuned values of the window live; the code holds none of them. A
# user file has the same form and only needs the keys it changes (--config FILE). It can be the
# same file as the settings of the library (phoenix-cad.default.cfg): each part reads its own
# sections. Lengths are written with their unit (mm, um, in, mil, ...); text after " #" is a comment.

[window]
width = 1180                # pixels of the window when it opens
height = 760
min_width = 760
min_height = 480

[view]
yaw = 35                    # degrees: the turn of the 3D view about the vertical axis
pitch = 28                  # degrees above the horizon (90 looks straight down)
zoom_min = 0.2              # a view never zooms out beyond this ...
zoom_max = 12               # ... or in beyond this, times the size that fits its pane
rotate_speed = 0.4          # degrees of turn for each pixel dragged
wheel_speed = 0.0015        # zoom for each unit of the mouse wheel (the exponent of the factor)
circle_segments = 32        # segments of the circle that draws a hole or a post
margin = 24                 # pixels left empty around the drawing when it is fitted to its pane

[new_box]
# the box a new project starts with
inner_length = 100 mm
inner_width = 60 mm
inner_height = 30 mm
wall = 2 mm
floor = 2 mm
lid = 3 mm
edge_margin = 3 mm
min_web = 2 mm

[fit]
# the envelope that is checked when the project has no board of its own
length = 90 mm
width = 50 mm
height = 20 mm

[edges]
size = 1 mm                 # the size given to an edge that is changed from sharp to rounded or chamfered

[new_step]
# what a hole, a post or an edge treatment added from the window starts with
tries = 12                  # positions tried (moving by the pitch each time) before the step is refused
pitch = 12 mm               # the distance between two tries
hole_face = front           # front, back, left, right, top or bottom
hole_u = 14 mm              # the position of the centre to the right, from the lower left corner of the face
hole_v = 15 mm              # the position of the centre upwards
hole_diameter = 6 mm
post_x = 10 mm              # from the inner face of the left wall
post_y = 10 mm              # from the inner face of the front wall
post_outer = 8 mm
post_height = 6 mm
post_kind = insert          # insert or self-tapping
post_bore_diameter = 4.2 mm
post_bore_depth = 5 mm
