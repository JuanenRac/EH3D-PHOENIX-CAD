# EH3D-PHOENIX-CAD, the 2D drawings (the sheets of plans): the settings, with their default values.
#
# This is the one file where the tuned values of the drawings live; the code holds none of them. A user
# file has the same form and only needs the keys it changes (--config FILE). It can be the same file as
# the settings of the library (phoenix-cad.default.cfg), of the history, of the window and of the sketch:
# each part reads its own sections. Lengths are written with their unit (mm, um, in, mil); a colour is six
# hexadecimal digits without the hash sign; text after " #" is a comment.

[sheet]
# the sheet
default_format = A4            # a name of the formats below
default_orientation = landscape   # landscape | portrait
default_scale = 1:1            # the scale of a new sheet: auto, or one of the scales below
scales = 10:1 5:1 2:1 1:1 1:2 1:5 1:10 1:20 1:50 1:100   # the standard scales that "auto" chooses from
projection = third             # third | first: where the top and the side views go round the front one
margin = 10 mm                 # the frame is this far from the edge of the sheet
view_gap = 20 mm               # the room left between two views
hidden_lines = 1               # 1: the views of a new sheet show the hidden edges (a view can say otherwise)
default_material = unspecified # the material of a part of the bill that has none
line_group = 0.35 mm           # the thick line; the thin one is half of it

# the sizes of the sheets, short side by long side (the ISO series A, and any other the person adds)
format.A4 = 210 mm x 297 mm
format.A3 = 297 mm x 420 mm
format.A2 = 420 mm x 594 mm
format.A1 = 594 mm x 841 mm
format.A0 = 841 mm x 1189 mm

# the dimensions
dim.text_height = 3.5 mm
dim.arrow_length = 3 mm
dim.arrow_width = 1 mm         # the arrow is a V this wide at its open end
dim.extension_gap = 1 mm       # the extension line starts this far from the part
dim.extension_overshoot = 2 mm # and goes this far past the dimension line
dim.offset = 10 mm             # the first dimension line is this far from the view
dim.step = 7 mm                # the next ones, stacked, are this far from each other
dim.decimals = 2               # 0 to 6
dim.leader_length = 12 mm      # the leader of a radius or a diameter
dim.leader_angle = 45          # degrees, counter-clockwise from the right
dim.arc_radius = 15 mm         # the arc of an angle

# the balloons
balloon.radius = 5 mm
balloon.text_height = 3.5 mm

# the title block
titleblock.enabled = 1
titleblock.width = 180 mm
titleblock.row = 7 mm
titleblock.columns = 2
titleblock.fields = organisation title number revision author scale sheet material
titleblock.value.organisation =
titleblock.value.title =
titleblock.value.number =
titleblock.value.revision = A
titleblock.value.author =
titleblock.value.material =

# the table of the bill of materials, drawn above the title block
bom.table = 1
bom.row = 6 mm
bom.width = 180 mm

# the layers (the line type is continuous, dashed or dashdot; the width is thick, thin or a length)
layer.names = OUTLINE HIDDEN CENTER DIMENSION TEXT BALLOON FRAME
layer.OUTLINE.color = 111111
layer.OUTLINE.width = thick
layer.OUTLINE.line = continuous
layer.OUTLINE.visible = 1
layer.OUTLINE.locked = 0
layer.HIDDEN.color = 666666
layer.HIDDEN.width = thin
layer.HIDDEN.line = dashed
layer.HIDDEN.visible = 1
layer.HIDDEN.locked = 0
layer.CENTER.color = 0a6e8a
layer.CENTER.width = thin
layer.CENTER.line = dashdot
layer.CENTER.visible = 1
layer.CENTER.locked = 0
layer.DIMENSION.color = 1d6b2f
layer.DIMENSION.width = thin
layer.DIMENSION.line = continuous
layer.DIMENSION.visible = 1
layer.DIMENSION.locked = 0
layer.TEXT.color = 111111
layer.TEXT.width = thin
layer.TEXT.line = continuous
layer.TEXT.visible = 1
layer.TEXT.locked = 0
layer.BALLOON.color = 9a3412
layer.BALLOON.width = thin
layer.BALLOON.line = continuous
layer.BALLOON.visible = 1
layer.BALLOON.locked = 0
layer.FRAME.color = 111111
layer.FRAME.width = thick
layer.FRAME.line = continuous
layer.FRAME.visible = 1
layer.FRAME.locked = 0

# the limits (a file or a request beyond them is refused, never cut short)
max_file_bytes = 262144        # the largest drawing file that is read
max_views = 16
max_dims = 500
max_balloons = 500
max_parts = 500                # the lines of the bill
max_extra_lines = 8            # the lines of a newer program that a record keeps as they are
max_extra_bytes = 512          # the most bytes of one of those lines
max_text = 80                  # the most characters of a text typed by the person
max_cells = 1000000            # the most cells of the grid of a solid
max_edges = 50000              # the most edges of a view
max_iso_tests = 20000000       # the most tests of one edge against one prism in an isometric view
