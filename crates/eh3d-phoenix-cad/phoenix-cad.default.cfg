# EH3D-PHOENIX-CAD: the settings, with their default values.
#
# This is the one file where tuned values live; the code holds none of them. A user file has the
# same form and only needs the keys it changes. Lengths are written with their unit (mm, um, in,
# mil, ...); the decimal separator is a point or a comma. Text after " #" is a comment.
#
# The screw table below was typed by hand from the usual sizes of metric screws (medium clearance
# holes, socket head cap screws, flat countersunk heads). Check every number against the standard
# you build to before you rely on it: no test compares it with the standard.

[save]
backups = 3                 # copies kept when a file is saved over an older one (0 keeps none)

[undo]
depth = 100                 # transactions that can be undone

[units]
display = mm                # nm, um, mm, cm, m, in or mil
decimals = 3

[printer]
hole_compensation = 0.15 mm # added to every hole diameter of the model for fabrication
small_hole_limit = 3 mm     # holes narrower than this get the extra below as well
small_hole_extra = 0.10 mm
fit_clearance = 0.20 mm     # gap between two parts that must fit (a lid on its box)

[screws]
counterbore_extra = 0.5 mm  # added to the head diameter for a counterbore

[screw.M2]
nominal = 2 mm
clearance = 2.4 mm
head_diameter = 3.8 mm
head_height = 2 mm
countersink_diameter = 4.0 mm

[screw.M2.5]
nominal = 2.5 mm
clearance = 2.9 mm
head_diameter = 4.5 mm
head_height = 2.5 mm
countersink_diameter = 5.0 mm

[screw.M3]
nominal = 3 mm
clearance = 3.4 mm
head_diameter = 5.5 mm
head_height = 3 mm
countersink_diameter = 6.3 mm

[screw.M4]
nominal = 4 mm
clearance = 4.5 mm
head_diameter = 7 mm
head_height = 4 mm
countersink_diameter = 8.4 mm

[screw.M5]
nominal = 5 mm
clearance = 5.5 mm
head_diameter = 8.5 mm
head_height = 5 mm
countersink_diameter = 10.5 mm

[screw.M6]
nominal = 6 mm
clearance = 6.6 mm
head_diameter = 10 mm
head_height = 6 mm
countersink_diameter = 12.6 mm

[screw.M8]
nominal = 8 mm
clearance = 9 mm
head_diameter = 13 mm
head_height = 8 mm
countersink_diameter = 16.8 mm

# Posts that rise from the floor of the box, one entry for each screw of the table above (the name
# is the same). Like the table of screws, these figures were typed by hand from the usual sizes of
# threaded inserts and of the pilot holes of self-tapping screws in printed plastic: check them
# against the insert or the screw you really use before you rely on them.
[fixing.M2]
post_diameter = 6 mm        # outer diameter of the post
insert_diameter = 3.2 mm    # bore for a threaded insert
insert_depth = 3 mm
pilot_diameter = 1.7 mm     # pilot hole for a self-tapping screw
pilot_depth = 5 mm

[fixing.M2.5]
post_diameter = 6.5 mm
insert_diameter = 3.6 mm
insert_depth = 4 mm
pilot_diameter = 2.1 mm
pilot_depth = 6 mm

[fixing.M3]
post_diameter = 8 mm
insert_diameter = 4.2 mm
insert_depth = 5 mm
pilot_diameter = 2.5 mm
pilot_depth = 8 mm

[fixing.M4]
post_diameter = 10 mm
insert_diameter = 5.6 mm
insert_depth = 6 mm
pilot_diameter = 3.3 mm
pilot_depth = 10 mm

[fixing.M5]
post_diameter = 11 mm
insert_diameter = 6.6 mm
insert_depth = 7 mm
pilot_diameter = 4.2 mm
pilot_depth = 12 mm

[fixing.M6]
post_diameter = 13 mm
insert_diameter = 8 mm
insert_depth = 8 mm
pilot_diameter = 5 mm
pilot_depth = 14 mm

[fixing.M8]
post_diameter = 16 mm
insert_diameter = 10 mm
insert_depth = 10 mm
pilot_diameter = 6.8 mm
pilot_depth = 18 mm

[posts]
min_wall = 1.2 mm           # the least wall between the bore and the outside of a post
base_extra = 4 mm           # added to the diameter of a post for the foot that reinforces it
base_height = 2 mm          # height of that foot

# The screwed lid. The gap of the lip is the fit clearance of the printer.
[lid]
lip_thickness = 1.2 mm      # thickness of the ring that centres the lid in the opening
lip_depth = 3 mm            # how far the ring hangs below the lid
corner_inset = 6 mm         # distance from a corner screw to the two walls of its corner

# The language of expressions of the parameters (see docs/EXPRESSIONS.md). These are hard limits:
# an expression beyond one of them is refused, whatever it says.
[expr]
max_length = 512            # characters of one expression
max_depth = 64              # levels of nesting (parentheses, signs, arguments) and of the tree
max_steps = 10000           # steps of one calculation of the parameters of a box
max_exponent = 64           # the largest exponent of a power such as 2 ^ 10

# Named values for expressions: a number with its unit, or a formula over the sizes named here. The
# sizes of the screws and the printer are named by rule: screw_M3_clearance, screw_M2_5_nominal
# (a point becomes an underscore), printer_fit_clearance, counterbore_extra, and so on. A
# constant of this section can use those, not the other constants of the section.
[constants]
nozzle = 0.4 mm
layer_height = 0.2 mm

# Densities in kilograms per cubic metre and prices of a kilogram (in the currency of [cost], up to
# three decimals): typical figures of the usual filaments and metals, to be replaced by the ones on
# the label and the invoice of the material that is really used. A material without a price_per_kg
# is left out of the cost of the bill of materials.
[material.PLA]
density_kg_m3 = 1240
price_per_kg = 20

[material.PETG]
density_kg_m3 = 1270
price_per_kg = 22

[material.ABS]
density_kg_m3 = 1040
price_per_kg = 22

[material.ASA]
density_kg_m3 = 1070
price_per_kg = 28

[material.PA12]
density_kg_m3 = 1010
price_per_kg = 70

[material.aluminium]
density_kg_m3 = 2700
price_per_kg = 6

[material.steel]
density_kg_m3 = 7850
price_per_kg = 2

[material.stainless]
density_kg_m3 = 8000
price_per_kg = 5

# The limits of the mechanical domain of the project file (see docs/PROJECT_DOMAIN.md). These are
# hard limits: a domain over one of them is refused when it is read and when it is written.
[mechanical]
max_bytes = 16777216        # bytes of the whole domain
max_steps = 10000           # steps of the recipe
max_name_bytes = 256        # bytes of a name before it is escaped
max_outline_points = 10000  # points of the outline of the board
max_board_holes = 1000      # mounting holes of the board

# The limits of the operations that repeat things (see docs/PROJECT_DOMAIN.md).
[pattern]
max_count = 256             # the most positions of one pattern of holes or posts; a pattern is checked position by position
max_parts = 64              # the most positions of one pattern of parts of the catalog (a line, a grid or a circle), the seed among them, from 2 to 10000; every copy is a part of its own and counts against catalog.max_instances

# The order sheet: the bars to buy, the holes to drill and the parts with their cost as one HTML page (see docs/EXPORT.md).
[order]
max_rows = 2000             # the most rows of any table of the sheet; a model with more is refused with PHOENIX-CAD-050

# The limits of the cooling fins that can be added to a face (see docs/PROJECT_DOMAIN.md).
[fins]
max_count = 128             # the most fins of one set
min_thickness = 0.8 mm      # the thinnest fin that is accepted (two lines of a 0.4 mm nozzle)
min_gap = 3 mm              # the least air between two fins, and between two sets of fins on a face
max_height_ratio = 12       # the tallest fin, as a multiple of its thickness

# The estimate of the heat that cooling fins give to still air. It is an estimate of a simple
# model (one coefficient for the whole surface, fins of constant section, radiation only when the
# emissivity is above 0 and then only from the outer envelope of the set unless fin_view_factor is
# 1, no interference between neighbouring fins), not a measurement and not a simulation.
[thermal]
convection_w_m2k = 8        # coefficient of natural convection, in W/(m2 K); 5 to 10 is usual for still air
conductivity_w_mk = 200     # conductivity of the material of the fins, in W/(m K); aluminium is about 200, printed plastic about 0.2
delta_t_k = 40              # how many kelvin the base of the fins is warmer than the air
emissivity = 0              # emissivity of the surface of the fins, from 0 to 1; 0 leaves the radiation out (printed plastic is about 0.9, bare aluminium about 0.1, anodised about 0.8)
ambient_k = 293.15          # temperature of the air in kelvin, from 200 to 500; the radiation depends on it
fin_view_factor = 0         # 1: the opening between two fins radiates as a cavity (its effective emissivity follows the view factor from the surfaces inside it to the opening; only with an emissivity above 0), 0: only the outer envelope of the set radiates

# The catalog of parts (profiles, screws and brackets) and the parts placed in a model (see
# docs/PROJECT_DOMAIN.md). The material of a part is one of the [material.*] sections above.
[catalog]
max_bytes = 262144          # the largest library file that is read
max_parts = 512             # the most parts of one library
max_name_bytes = 64         # the longest name of a part, a library or a material
max_dimension = 6000 mm     # the largest size of any dimension of a part, and the farthest a part can lie from the origin
max_instances = 1000        # the most parts placed in one model
min_cut = 1 mm              # the shortest cut of a profile
refuse_profile_overlap = 1  # 1 refuses two profiles whose bounding boxes share volume (touching is fine), 0 allows it

# The assembly: mates that place a part relative to another, and the check of which parts share
# volume (see docs/ASSEMBLY.md).
[assembly]
max_mates = 1000            # the most mates in one model
hole_clearance = 0 mm       # a screw passes through the hole of a bracket when the hole is at least this much wider than its shank (0 allows a shank as wide as the hole)
max_report_pairs = 100      # the most pairs of parts in conflict that a report lists (the rest are counted)
interference_tolerance = 0 mm  # two parts whose boxes overlap by no more than this, along the smallest overlap, are not in conflict (0 checks any overlap)

# The cutting plan of the profiles (see docs/CATALOG.md): the pieces of the cut list are fitted
# into bars of the longest length each profile comes in.
[stock]
kerf = 3 mm                 # the material the saw takes at every cut
end_trim = 5 mm             # cut away from each end of a bar (rough ends)
reusable_offcut = 100 mm    # an offcut at least this long is kept as stock; a shorter one is scrap
max_bars = 1000             # the most bars one plan may need; more is refused

# The cost of the bill of materials with cost (see docs/CATALOG.md): the mass of each line times the
# price_per_kg of its material, plus what each piece costs besides its material, plus a markup.
[cost]
currency = EUR              # the code of the currency, two to eight capital letters, written next to the figures
per_piece = 0               # what each piece costs besides its material (cutting, drilling, handling), up to three decimals
markup_percent = 0          # the percentage added to the sum of the lines (waste, margin), from 0 to 1000

# The room between the placed parts (see docs/ASSEMBLY.md): pairs that do not touch and are closer
# than this are listed by the command `clearance`.
[clearance]
min_gap = 2 mm              # the least distance between the bounding boxes of two parts that do not touch (0 turns the check off)
max_pairs = 100             # the most pairs a report lists (the rest are counted)

# The table of where the placed parts are and the exploded view (see docs/ASSEMBLY.md).
[placement]
max_explode_percent = 500   # the most that an exploded view may pull the parts apart, in percent of the distance of each part from the middle of the assembly

# The solid that the STL file is made of (see docs/EXPORT.md). The volume of the triangles is
# checked against the exact volume of the model; a model that does not match is refused.
[mesh]
circle_segments = 64        # sides of every circle, a multiple of 4 from 8 to 720 (a circle is drawn with the area of the true circle)
max_triangles = 400000      # the most triangles of one export; more is refused
stl_binary = 1              # 1 writes a binary STL file, 0 a text one
volume_tolerance_ppm = 2000 # how many parts per million the volume of the triangles may differ from the exact volume of the model

# The flat drawings, DXF and SVG (see docs/EXPORT.md).
[drawing]
max_entities = 20000        # the most lines, circles and arcs of one drawing; more is refused
svg_width = 200 mm          # the width of the page of the SVG drawing, which is scaled to fit it
dimensions = 1              # 1 puts the dimensions of the box and the sizes of the holes in the SVG drawing, 0 leaves them out
axis_overshoot = 3 mm       # how far the centre lines go past the holes and the box
dxf_dimensions = 1          # 1 puts the dimensions in the DXF drawing too, on the layer COTAS; 0 leaves them out
hole_dimensions = 1         # 1 dimensions the positions of the holes of the face of the view from the lower left corner of the box; 0 only the size of the box
max_dimensions = 40         # the most dimensions of hole positions in one view; more is refused
hatch_spacing = 2 mm        # the distance between the hatching lines of a section drawing, measured across them (0 leaves the hatching out, otherwise from 0.2 mm to 100 mm)
legend = 1                  # 1 writes the list of the dimensions (box, thickness of walls, floor and lid, tag, diameter and position of each hole) to the right of the box, where the dimensions are; 0 leaves it out
legend_gap = 10 mm          # the room between the box and that list, from 0 mm to 1000 mm
hidden_lines = 1            # 1 draws the cavity of the box (the inside of its walls, floor and lid) as dashed hidden lines on the layer OCULTAS in the views; 0 leaves it out
frame = 0                   # 1 draws a border on the layer MARCO round the views, their dimensions and their legend; 0 leaves it out
frame_margin = 5 mm         # the air between what is drawn and that border, from 0 mm to 1000 mm
sheet_angle = 1             # the sheet of several views (export --view sheet): 1 puts the plan under the front and the side to the left of it (first angle, ISO), 3 the plan over the front and the side to the right of it (third angle)
sheet_gap = 20 mm           # the air between two views of the sheet, besides the room their dimension lines take, from 0 mm to 1000 mm
paper = 0                   # the paper of the SVG drawing: 0 scales it to svg_width, 1 to 5 put it centred on a sheet of the A series (A1 to A5) at the largest standard scale that fits (the scale is written on the drawing and in the title block)
paper_margin = 10 mm        # the air between the drawing and the edge of the paper, from 0 mm to 100 mm
paper_portrait = 0          # 1 stands the paper upright, 0 lays it across

[title_block]
# the table in the lower right corner of the DXF and SVG drawings (organisation, title, number, revision, author and scale); the values are written as they are, in any language
enabled = 0                 # 1 draws the title block under the drawing, 0 leaves it out
organisation =              # the organisation (at most 80 characters)
title =                     # the title; empty means the name of the project or of the sketch
number =                    # the number of the drawing
revision = A                # the revision
author =                    # the author
width = 120 mm              # the width of the block, from 60 mm to 400 mm
row = 7 mm                  # the height of each of its four rows, from 4 mm to 20 mm
