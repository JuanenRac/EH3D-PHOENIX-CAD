# EH3D-PHOENIX-CAD: the settings, with their default values.
#
# This is the one file where tuned values live; the code holds none of them. A user file has the
# same form and only needs the keys it changes. Lengths are written with their unit (mm, um, in,
# mil, ...); the decimal separator is a point or a comma. Text after " #" is a comment.
#
# The screw table below was typed by hand from the usual sizes of metric screws (medium clearance
# holes, socket head cap screws, flat countersunk heads). Check every number against the standard
# you build to before you rely on it: no test compares it with the standard.

[save]
backups = 3                 # copies kept when a file is saved over an older one (0 keeps none)

[undo]
depth = 100                 # transactions that can be undone

[units]
display = mm                # nm, um, mm, cm, m, in or mil
decimals = 3

[printer]
hole_compensation = 0.15 mm # added to every hole diameter of the model for fabrication
small_hole_limit = 3 mm     # holes narrower than this get the extra below as well
small_hole_extra = 0.10 mm
fit_clearance = 0.20 mm     # gap between two parts that must fit (a lid on its box)

[screws]
counterbore_extra = 0.5 mm  # added to the head diameter for a counterbore

[screw.M2]
nominal = 2 mm
clearance = 2.4 mm
head_diameter = 3.8 mm
head_height = 2 mm
countersink_diameter = 4.0 mm

[screw.M2.5]
nominal = 2.5 mm
clearance = 2.9 mm
head_diameter = 4.5 mm
head_height = 2.5 mm
countersink_diameter = 5.0 mm

[screw.M3]
nominal = 3 mm
clearance = 3.4 mm
head_diameter = 5.5 mm
head_height = 3 mm
countersink_diameter = 6.3 mm

[screw.M4]
nominal = 4 mm
clearance = 4.5 mm
head_diameter = 7 mm
head_height = 4 mm
countersink_diameter = 8.4 mm

[screw.M5]
nominal = 5 mm
clearance = 5.5 mm
head_diameter = 8.5 mm
head_height = 5 mm
countersink_diameter = 10.5 mm

[screw.M6]
nominal = 6 mm
clearance = 6.6 mm
head_diameter = 10 mm
head_height = 6 mm
countersink_diameter = 12.6 mm

[screw.M8]
nominal = 8 mm
clearance = 9 mm
head_diameter = 13 mm
head_height = 8 mm
countersink_diameter = 16.8 mm

# Posts that rise from the floor of the box, one entry for each screw of the table above (the name
# is the same). Like the table of screws, these figures were typed by hand from the usual sizes of
# threaded inserts and of the pilot holes of self-tapping screws in printed plastic: check them
# against the insert or the screw you really use before you rely on them.
[fixing.M2]
post_diameter = 6 mm        # outer diameter of the post
insert_diameter = 3.2 mm    # bore for a threaded insert
insert_depth = 3 mm
pilot_diameter = 1.7 mm     # pilot hole for a self-tapping screw
pilot_depth = 5 mm

[fixing.M2.5]
post_diameter = 6.5 mm
insert_diameter = 3.6 mm
insert_depth = 4 mm
pilot_diameter = 2.1 mm
pilot_depth = 6 mm

[fixing.M3]
post_diameter = 8 mm
insert_diameter = 4.2 mm
insert_depth = 5 mm
pilot_diameter = 2.5 mm
pilot_depth = 8 mm

[fixing.M4]
post_diameter = 10 mm
insert_diameter = 5.6 mm
insert_depth = 6 mm
pilot_diameter = 3.3 mm
pilot_depth = 10 mm

[fixing.M5]
post_diameter = 11 mm
insert_diameter = 6.6 mm
insert_depth = 7 mm
pilot_diameter = 4.2 mm
pilot_depth = 12 mm

[fixing.M6]
post_diameter = 13 mm
insert_diameter = 8 mm
insert_depth = 8 mm
pilot_diameter = 5 mm
pilot_depth = 14 mm

[fixing.M8]
post_diameter = 16 mm
insert_diameter = 10 mm
insert_depth = 10 mm
pilot_diameter = 6.8 mm
pilot_depth = 18 mm

[posts]
min_wall = 1.2 mm           # the least wall between the bore and the outside of a post
base_extra = 4 mm           # added to the diameter of a post for the foot that reinforces it
base_height = 2 mm          # height of that foot

# The screwed lid. The gap of the lip is the fit clearance of the printer.
[lid]
lip_thickness = 1.2 mm      # thickness of the ring that centres the lid in the opening
lip_depth = 3 mm            # how far the ring hangs below the lid
corner_inset = 6 mm         # distance from a corner screw to the two walls of its corner

# The language of expressions of the parameters (see docs/EXPRESSIONS.md). These are hard limits:
# an expression beyond one of them is refused, whatever it says.
[expr]
max_length = 512            # characters of one expression
max_depth = 64              # levels of nesting (parentheses, signs, arguments) and of the tree
max_steps = 10000           # steps of one calculation of the parameters of a box
max_exponent = 64           # the largest exponent of a power such as 2 ^ 10

# Named values for expressions: a number with its unit, or a formula over the sizes named here. The
# sizes of the screws and the printer are named by rule: screw_M3_clearance, screw_M2_5_nominal
# (a point becomes an underscore), printer_fit_clearance, counterbore_extra, and so on. A
# constant of this section can use those, not the other constants of the section.
[constants]
nozzle = 0.4 mm
layer_height = 0.2 mm

# Densities in kilograms per cubic metre: typical figures of the usual filaments and metals, to be
# replaced by the ones on the label of the material that is really used.
[material.PLA]
density_kg_m3 = 1240

[material.PETG]
density_kg_m3 = 1270

[material.ABS]
density_kg_m3 = 1040

[material.ASA]
density_kg_m3 = 1070

[material.PA12]
density_kg_m3 = 1010

[material.aluminium]
density_kg_m3 = 2700

# The limits of the mechanical domain of the project file (see docs/PROJECT_DOMAIN.md). These are
# hard limits: a domain over one of them is refused when it is read and when it is written.
[mechanical]
max_bytes = 16777216        # bytes of the whole domain
max_steps = 10000           # steps of the recipe
max_name_bytes = 256        # bytes of a name before it is escaped
max_outline_points = 10000  # points of the outline of the board
max_board_holes = 1000      # mounting holes of the board
