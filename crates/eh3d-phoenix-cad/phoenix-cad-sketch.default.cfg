# EH3D-PHOENIX-CAD, the sketch: the settings of the solver and of the file, with their default values.
#
# This is the one file where the tuned values of the sketch live; the code holds none of them. A user
# file has the same form and only needs the keys it changes. It can be the same file as the settings of
# the library (phoenix-cad.default.cfg) and of the window (phoenix-cad-window.default.cfg): each part
# reads its own sections. Text after " #" is a comment.
#
# The solver works in millimetres. It looks for the positions that make every residual of the
# constraints zero by damped least squares, and rounds the result to the nanometre.

[sketch]
tolerance = 0.00000001      # mm: the solution is accepted when no residual is larger than this
max_iterations = 100        # steps of the solver before it gives up
max_step = 50               # mm: the largest move of any coordinate in one step
fd_step = 0.0001            # mm: the step of the central differences that give the Jacobian
rank_tolerance = 0.000001   # a row of the Jacobian that adds less than this (relative) is redundant
damping_start = 0.001       # the first damping of the least squares
damping_factor = 10         # the damping grows or shrinks by this factor after a refused or accepted step
damping_max = 1000000000000 # beyond this damping the solver stops: no step gets nearer
stall_tolerance = 0.0000001 # the gradient below which the solver is at a minimum that is not a solution
max_elements = 500          # the most elements of a sketch (a bigger sketch is refused)
max_constraints = 1000      # the most constraints of a sketch
max_file_bytes = 1048576    # the largest sketch file that is read
